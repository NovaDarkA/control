name: Compilar instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Verificar tipos
        run: npm run typecheck
      - name: Compilar instalador
        run: npm run dist
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ProjectControl-Setup
          path: dist/*.exe
