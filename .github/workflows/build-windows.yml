name: Compilar instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project-control/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project-control/package.json
      - name: Instalar dependencias
        run: npm install
      - name: Verificar tipos
        run: npm run typecheck
      - name: Compilar instalador
        run: npm run dist
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ProjectControl-Setup
          path: project-control/dist/*.exe
          if-no-files-found: error
